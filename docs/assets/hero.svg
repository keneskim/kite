<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="430" viewBox="0 0 1280 430" role="img" aria-labelledby="title desc">
  <title id="title">Kite — small syntax, more places to go</title>
  <desc id="desc">The Kite programming language. A teal kite travels from concise source code to C, JavaScript, Java and Unity C#.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2=".6"><stop stop-color="#101c2c"/><stop offset="1" stop-color="#0c1320"/></linearGradient>
    <linearGradient id="mint" x2="1" y2="1"><stop stop-color="#a1f5dc"/><stop offset="1" stop-color="#38c7bc"/></linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#456079" stroke-opacity=".14"/></pattern>
  </defs>
  <rect width="1280" height="430" rx="24" fill="url(#bg)"/>
  <rect width="1280" height="430" rx="24" fill="url(#grid)"/>
  <path d="M676 350c100 20 40-90 125-117s199 70 253-33 10-117 126-141" fill="none" stroke="#31516c" stroke-width="2" stroke-dasharray="5 10"/>
  <g transform="translate(64 56)">

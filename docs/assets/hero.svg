    <text x="48" y="7" fill="#9bb1c6" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="600" letter-spacing="2.3">THE KITE PROGRAMMING LANGUAGE</text>
    <text y="122" fill="#f0f7fc" font-family="Segoe UI,Arial,sans-serif" font-size="104" font-weight="700" letter-spacing="-5">Kite<tspan fill="#7de9cc">.</tspan></text>
    <text y="174" fill="#c9d9e6" font-family="Segoe UI,Arial,sans-serif" font-size="26" letter-spacing="-.3">Small syntax. More places to go.</text>
    <text y="214" fill="#8fa6bb" font-family="Segoe UI,Arial,sans-serif" font-size="17">Type inference · Modules · Records · Multiple backends</text>
    <g transform="translate(0 267)" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="600" text-anchor="middle">
      <rect width="52" height="34" rx="8" fill="#172d3c" stroke="#35566a"/><text x="26" y="22" fill="#a5f0dc">C</text>
      <rect x="64" width="120" height="34" rx="8" fill="#172d3c" stroke="#35566a"/><text x="124" y="22" fill="#a5f0dc">JavaScript</text>
      <rect x="196" width="70" height="34" rx="8" fill="#172d3c" stroke="#35566a"/><text x="231" y="22" fill="#a5f0dc">Java</text>
      <rect x="278" width="110" height="34" rx="8" fill="#172d3c" stroke="#35566a"/><text x="333" y="22" fill="#a5f0dc">Unity C#</text>
    </g>
  </g>
